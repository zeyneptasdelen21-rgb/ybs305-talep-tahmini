services:
  warehouse:
    image: postgres:16-alpine
    container_name: tamamlayici-talep-postgres
    environment:
      POSTGRES_DB: retail_analytics
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d retail_analytics"]
      interval: 5s
      timeout: 5s
      retries: 20
  metabase:
    image: metabase/metabase:v0.64.1.x
    container_name: tamamlayici-talep-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Europe/Istanbul
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      warehouse:
        condition: service_healthy
  project:
    build: .
    working_dir: /workspace/dbt
    volumes:
      - .:/workspace
    environment:
      DBT_PROFILES_DIR: /workspace/dbt
      DBT_HOST: warehouse
      DBT_USER: analyst
      DBT_PASSWORD: local_dev_only
      DBT_DB: retail_analytics
      DBT_SCHEMA: analytics
    depends_on:
      warehouse:
        condition: service_healthy
    entrypoint: ["dbt"]
volumes:
  postgres_data:
  metabase_data:
